<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table Test</title>
  </head>
  <body>
    <table
      border="1"
      width="80%"
      align="center"
      cellpadding="4"
      bgcolor="#eae9e9"
    >
      <caption>
        <b>Quaterly Sales Report(INR)</b>
      </caption>
      <thead>
        <tr bgcolor="darkgray">
          <th>Category</th>
          <th>Product</th>
          <th>Q1 Sales</th>
          <th>Q2 Sales</th>
        </tr>
      </thead>
      <tbody>
        <tr bgcolor="#cfcfcf">
          <td rowspan="2" bgcolor="white">Electronics</td>
          <td>Smartphones</td>
          <td align="right">₹4,72,450</td>
          <td align="right">₹5,85,838</td>
        </tr>
        <tr bgcolor="#cfcfcf">
          <td>Laptops</td>
          <td align="right">₹8,03,165</td>
          <td align="right">₹8,59,859</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td colspan="2"><b>Total Gross</b></td>
          <td align="right"><b>₹12,75,615</b></td>
          <td align="right"><b>₹14,45,697</b></td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
